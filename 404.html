<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Página no encontrada — Juegos de vocabulario</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',system-ui,sans-serif;background:linear-gradient(135deg,#FCD116 0%,#003893 50%,#CE1126 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;border-radius:20px;padding:28px;max-width:440px;text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.22)}
h1{font-size:1.6rem;color:#003893;margin-bottom:8px}
p{color:#374151;margin-bottom:18px;line-height:1.5}
a{display:inline-block;background:#003893;color:#fff;font-weight:800;text-decoration:none;padding:10px 18px;border-radius:999px}
</style>
</head>
<body>
<div class="card">
  <h1>Página no encontrada</h1>
  <p>This page isn't part of the vocabulary games site.</p>
  <a id="home" href="/">← Ir a los juegos</a>
</div>
<script>
// GitHub Pages serves this file for any missing path; link back to the project root (first path segment).
(function () {
  var seg = location.pathname.split('/').filter(Boolean)[0];
  if (location.hostname.endsWith('github.io') && seg) document.getElementById('home').href = '/' + seg + '/';
})();
</script>
</body>
</html>
